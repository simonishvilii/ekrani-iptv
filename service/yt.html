<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>yt</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } #p { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }</style>
</head>
<body>
<div id="p"></div>
<script>
/* Ekrani IPTV: YouTube player host. Served over http://127.0.0.1 by the app's service, so YouTube
   gets a proper Referer (the app itself runs from file://, which YouTube rejects with error 153).
   The app drives it with postMessage: {cmd: 'play' | 'pause' | 'seek', t}. It reports
   {ev: 'ready' | 'state' | 'error' | 'time', ...} back. */
(function () {
  'use strict';
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
  });
  var id = /^[\w-]{11}$/.test(q.v || '') ? q.v : '';
  var start = Math.max(0, parseInt(q.start, 10) || 0);
  var p = null;

  /* YouTube picks the stream from the player's size (the API's quality setting is a no-op now).
     So the player is laid out at the target height (2160 = up to 4K, 1080, ...) and scaled down
     to fit the screen: it looks the same, but YouTube serves the higher quality. 0 = leave it to YouTube. */
  var target = Math.max(0, parseInt(q.h, 10) || 0);
  function size() {
    var el = document.getElementById('p');
    var w = window.innerWidth || 1920, h = window.innerHeight || 1080;
    var f = target > h ? target / h : 1;
    el.style.width = Math.round(w * f) + 'px';
    el.style.height = Math.round(h * f) + 'px';
    el.style.transform = f > 1 ? 'scale(' + (1 / f) + ')' : '';
  }
  size();
  window.addEventListener('resize', size);
  function quality() { try { return p && p.getPlaybackQuality ? p.getPlaybackQuality() : ''; } catch (e) { return ''; } }

  function send(o) { try { parent.postMessage(JSON.stringify(o), '*'); } catch (e) { /* ignore */ } }
  function num(f) { try { return p && p[f] ? p[f]() || 0 : 0; } catch (e) { return 0; } }

  if (!id) { send({ ev: 'error', data: 2 }); return; }

  window.onYouTubeIframeAPIReady = function () {
    p = new YT.Player('p', {
      width: '100%', height: '100%', videoId: id, host: 'https://www.youtube.com',
      playerVars: {
        autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3, playsinline: 1,
        modestbranding: 1, cc_load_policy: 0, start: start, origin: location.origin
      },
      events: {
        onReady: function () { send({ ev: 'ready' }); try { p.playVideo(); } catch (e) { /* ignore */ } },
        onStateChange: function (e) { send({ ev: 'state', data: e.data, t: num('getCurrentTime'), d: num('getDuration') }); },
        onError: function (e) { send({ ev: 'error', data: e.data }); }
      }
    });
    setInterval(function () {
      if (p && p.getPlayerState) send({ ev: 'time', t: num('getCurrentTime'), d: num('getDuration'), s: num('getPlayerState'), q: quality() });
    }, 500);
  };

  window.addEventListener('message', function (e) {
    if (e.source !== parent || !p) return;
    var m;
    try { m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
    if (!m || !m.cmd) return;
    try {
      if (m.cmd === 'play') p.playVideo();
      else if (m.cmd === 'pause') p.pauseVideo();
      else if (m.cmd === 'seek') p.seekTo(Math.max(0, +m.t || 0), true);
    } catch (x) { /* ignore */ }
  });

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () { send({ ev: 'error', data: 'api' }); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
